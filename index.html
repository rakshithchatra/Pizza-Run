<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1c2340" />
<title>Pizza Run</title>
<link rel="icon" href="/icon.svg" />
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="layer" hidden>
  <div class="row">
    <div class="left">
      <span class="pill" id="h-pill"><svg viewBox="0 0 20 20"><path d="M10 19 2 4h16z" fill="#ffc94a"/><path d="M1 2h18v3H1z" fill="#e0a440"/><circle cx="8" cy="8" r="1.7" fill="#b8261a"/><circle cx="12" cy="10" r="1.7" fill="#b8261a"/><circle cx="10" cy="14" r="1.4" fill="#b8261a"/></svg><span id="h-pizzas">0</span></span>
      <span class="power" id="p-magnet" hidden><span>Magnet</span></span>
      <span class="power" id="p-x2" hidden><span>2x pizzas</span></span>
    </div>
    <div>
      <span class="pill" style="padding-left:14px" id="h-score">0</span>
      <button id="pause" aria-label="Pause">II</button>
      <button id="h-mute" aria-label="Turn sound off"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="cross" d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div id="toast" hidden></div>
  <div id="tutor" hidden>
    <div class="swipe"><span class="finger"></span></div>
    <b id="tutor-text"></b>
  </div>
  <button id="skip" class="ghost" hidden>Skip lesson</button>
  <div id="count" hidden></div>
</div>

<div id="menu" class="layer screen">
  <h1>Pizza <span>Run</span></h1>
  <div class="stats">
    <span class="pill"><svg viewBox="0 0 20 20"><path d="M10 19 2 4h16z" fill="#ffc94a"/><path d="M1 2h18v3H1z" fill="#e0a440"/><circle cx="8" cy="8" r="1.7" fill="#b8261a"/><circle cx="12" cy="10" r="1.7" fill="#b8261a"/><circle cx="10" cy="14" r="1.4" fill="#b8261a"/></svg><span id="wallet">0</span><small>pizza points</small></span>
    <span class="pill" style="padding-left:14px"><small>Best</small><span id="best">0</span></span>
  </div>
  <div class="spacer"></div>
  <div class="picker">
    <button id="prev" aria-label="Previous runner">&lsaquo;</button>
    <div><b id="cname"></b><small id="cblurb"></small></div>
    <button id="next" aria-label="Next runner">&rsaquo;</button>
  </div>
  <button id="play" class="big">Run!</button>
  <button id="howto" class="ghost" style="margin-top:14px">How to play</button>
  <button id="mute" class="ghost" style="margin-top:8px">Sound on</button>
  <a class="tiny" href="privacy.html">Privacy</a>
</div>

<div id="over" class="layer screen" hidden>
  <!-- a slice hits the screen, says OOPS, and slides off leaving sauce -->
  <div class="smear"></div>
  <i class="blob" style="--x:-36vw; --y:-22vh; --s:1.5"></i>
  <i class="blob" style="--x:34vw; --y:-27vh; --s:1"></i>
  <i class="blob" style="--x:40vw; --y:-4vh; --s:1.9"></i>
  <i class="blob" style="--x:-42vw; --y:6vh; --s:1.1"></i>
  <i class="blob" style="--x:-22vw; --y:-33vh; --s:.8"></i>
  <i class="blob" style="--x:18vw; --y:-36vh; --s:1.3"></i>
  <div class="result">
    <span class="badge" id="o-record" hidden>New best score</span>
    <div class="card">
      <div class="line hero"><span>Pizza points</span><b id="o-pizzas">+0</b></div>
      <div class="line"><span>Distance</span><b id="o-metres">0 m</b></div>
      <div class="line"><span>Score</span><b id="o-score">0</b></div>
      <div class="line"><span>Wallet</span><b id="o-wallet">0</b></div>
    </div>
    <button id="again" class="big">Try again</button>
    <button id="home" class="ghost">Quit</button>
  </div>
  <div class="slice" aria-hidden="true">
    <svg viewBox="0 0 300 350">
      <path d="M150 338 22 72h256z" fill="#ffc94a" stroke="#1c2340" stroke-width="9" stroke-linejoin="round"/>
      <rect x="6" y="20" width="288" height="66" rx="33" fill="#e0a440" stroke="#1c2340" stroke-width="9"/>
      <circle cx="102" cy="128" r="23" fill="#b8261a"/><circle cx="204" cy="132" r="23" fill="#b8261a"/><circle cx="150" cy="262" r="19" fill="#b8261a"/>
      <text x="150" y="214" text-anchor="middle" font-size="60" font-weight="900" fill="#e23d28" stroke="#1c2340" stroke-width="9" paint-order="stroke" stroke-linejoin="round">OOPS!</text>
    </svg>
  </div>
</div>

<div id="paused" class="layer screen dim" hidden>
  <h2>Paused</h2>
  <button id="resume" class="big">Resume</button>
  <button id="quit" class="ghost">End run</button>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
